# Bundle patch for dsh-plugin-atlassian.
#
# One row on the HOST composition: `dsh-mcp-client`-style tool registration
# targets the host `tools` registry, which every session in the profile reads,
# and this plugin publishes no service of its own — so no `isolate` realm is
# needed and the row is safe to mount once for the whole process.
#
# `name` MUST equal the package name: `dsh-client-modules` resolves the
# package's `package.json` by it to find the browser half.
- insert:
    - id: atlassian
      name: dsh-plugin-atlassian
      config:
        serverName: atlassian
        # Atlassian MCP v2 — the DEFAULT endpoint, i.e. the small primary tool
        # set plus `discover` / `executeRead` / `executeWrite` /
        # `executeDestructive`. Deliberately NOT `?tools=all`: that flat
        # catalogue is ~200 tool definitions, which is tens of thousands of
        # tokens of context on every single request.
        #
        # v2 is a separate OAuth resource from v1: its authorization server is
        # `auth.atlassian.com/<id>` and a v1 client registration/token cannot be
        # reused. The session file is keyed by this URL, so switching endpoints
        # starts a clean registration rather than silently reusing v1 state.
        url: https://mcp.atlassian.com/v2/mcp
        # The Jira board needs tools that the default endpoint only exposes as
        # deferred (`listJiraProjects`, `getJiraBoardSprintData`,
        # `listJiraIssueTransitions`, …) and it calls them by name, so it reads
        # the flat catalogue on its own connection. Nothing from this endpoint
        # is registered for the model — it costs the panel a `tools/list`, not
        # the agent any context. Same OAuth resource as `url`, so the two share
        # one authorization.
        #
        # Set this equal to `url` to run one connection that behaves exactly
        # like the pre-0.2 release (every tool registered, large context).
        boardUrl: https://mcp.atlassian.com/v2/mcp?tools=all
        # Loopback port for the OAuth redirect URI. Must stay stable across
        # restarts: the dynamic client registration binds this exact URI, and
        # a changed port invalidates the stored client registration.
        redirectPort: 3334
        # Expected site, shown in Settings and checked after authorization.
        #
        # Deliberately empty. This patch ships inside the npm package, so it is
        # every installer's default — pinning a real site here would show a
        # bogus "site mismatch" warning to everyone else. Set your own site in
        # YOUR profile's cordis.patch.yml instead. A patch replaces the whole
        # `config` block rather than merging, so restate the other keys too.
        expectedSite: ''
        toolCallTimeoutMs: 60000
        authorizationTimeoutMs: 300000
        autoOpenBrowser: true
        # The Jira board panel.
        board:
          # JQL the board opens with. Empty selects the built-in default view,
          # `updated >= -180d AND statusCategory != Done` — work in flight,
          # because a long backlog otherwise buries it. Every view is bounded:
          # Atlassian refuses a wholly unconstrained search. The panel's own view
          # selector and JQL box override this for the session.
          jql: ''
          # A SAFETY CEILING, not a page size. The board always reads exactly
          # one project — the project chip is the board's scope and there is no
          # "all projects" option — and pages through its issues 100 per request
          # until the server reports the result complete. Only this ceiling stops
          # that walk early, and the footer says so when it does, so it exists
          # purely to keep a pathological site from hanging the panel.
          limit: 5000
          # Deadline for one board read: a search, plus the site-registry
          # lookup on a cold start, so it is allowed to outlast a tool call.
          timeoutMs: 90000
          # Instruction sent when an issue is handed to an agent. `{{key}}` and
          # `{{summary}}` are substituted; empty selects the built-in template,
          # which tells the agent to verify before editing and NOT to change the
          # Jira workflow — status transitions stay the user's call.
          promptTemplate: ''
          # Custom-field id of the sprint field when the site does not use the
          # default `sprint` field (e.g. `customfield_10020`). Empty asks for the
          # well-known field only; a set id is requested ALONGSIDE it, so a wrong
          # value cannot blind the sprint filter.
          sprintField: ''
