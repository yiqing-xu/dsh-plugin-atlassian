# Development overlay: same row, but nothing opens a browser on its own.
#
# A patch replaces the targeted row's WHOLE config rather than merging into
# it, so the full config is restated here.
#
#   dsh --profile atlassian-dev --patch ./dev/overlay-no-browser.yml --port 43199 --no-open
#
# Then drive the flow over HTTP, e.g.
#   curl http://127.0.0.1:43199/plugins/atlassian/status
- id: atlassian
  config:
    # Deliberately NOT `atlassian`. The session store is keyed by
    # (serverName, url), so a dev run under the production name loads the
    # authorization you actually use — and when the access token has expired
    # and the refresh fails, the OAuth client clears `tokens` out of it, which
    # costs you a re-authorization in your real profile. A distinct name gives
    # this profile its own store file and makes that impossible.
    serverName: atlassian-dev
    # v2 DEFAULT endpoint: only the primary tools are registered for the model,
    # which is what keeps a request's context small.
    url: https://mcp.atlassian.com/v2/mcp
    # The board's flat catalogue, on its own connection. Nothing from here is
    # registered; it exists so the panel can call the deferred tools by name.
    boardUrl: https://mcp.atlassian.com/v2/mcp?tools=all
    # Pinned, and deliberately NOT the production 3334. The dynamic client
    # registration binds this exact redirect URI, so a port that moves between
    # runs invalidates the registration and forces a fresh authorization — and
    # the desktop profile holds 3334 whenever it is running, which would push
    # every dev restart onto an ephemeral port.
    redirectPort: 3340
    # Empty so this sample works for any site. Put your own site here if you
    # want the post-authorization mismatch check while developing.
    expectedSite: ''
    toolCallTimeoutMs: 60000
    authorizationTimeoutMs: 300000
    autoOpenBrowser: false
    # Board defaults: what the panel opens with. Exercises the whole
    # config → /status → panel path. Left empty for the built-in bounded
    # fallback: this file is committed, so a real project key here would be a
    # real project key in a public repository. Put yours back locally if you
    # want the panel to open pinned to it.
    board:
      jql: ''
      limit: 25
      timeoutMs: 90000
      # Empty selects the built-in template. To verify a hand-over without the
      # agent developing anything, set an inert one here, e.g.
      #   promptTemplate: '只回复一行确认，不要读写文件。工单：{{key}}'
      promptTemplate: ''
